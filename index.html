:root{
  --bg:#070810; --bg2:#101119; --card:#14151e; --card2:#1c1e2a; --card3:#242636;
  --ink:#f5f6fb; --muted:#9a9bb0; --faint:#63647a;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --neon:#e3ff45; --neon2:#b6ff3a; --neon-ink:#0c0d08; --neon-glow:rgba(227,255,69,.45);
  --sp:#1ed760;
  /* glasiga (fadeade) ytor */
  --glass:rgba(255,255,255,.055); --glass2:rgba(255,255,255,.09); --glassb:rgba(255,255,255,.14);
  --fla:#ff4d8d; --aza:#b06bff; --lin:#2fd67a; --dun:#ffb038; --hoj:#33d6e6;
  --nav-h:58px; --player-h:0px;
  --safe-b:env(safe-area-inset-bottom,0px);
  --safe-t:env(safe-area-inset-top,0px);
  --disp:"Anton",Impact,sans-serif;
  --sans:"Space Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:var(--sans); font-size:16px; line-height:1.4; font-weight:500;
  -webkit-font-smoothing:antialiased; letter-spacing:-.005em;
  min-height:100vh; min-height:100dvh;
  padding-bottom:calc(var(--nav-h) + var(--player-h) + var(--safe-b));
  background-image:
    radial-gradient(85% 45% at 50% -8%, rgba(227,255,69,.12), transparent 60%),
    radial-gradient(70% 45% at 102% 4%, rgba(176,107,255,.12), transparent 60%),
    radial-gradient(70% 45% at -2% 12%, rgba(51,214,230,.09), transparent 60%),
    radial-gradient(90% 60% at 50% 108%, rgba(255,77,141,.08), transparent 60%);
  background-attachment:fixed;
}
h1,h2,h3{margin:0}
button{font-family:inherit;color:inherit;cursor:pointer}
a{color:inherit}
::-webkit-scrollbar{width:0;height:0}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,rgba(10,11,16,.98),rgba(10,11,16,.88));backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding-top:var(--safe-t)}
.brand{display:flex;align-items:center;gap:9px;padding:12px 16px 9px}
.brand .logo{height:28px;width:auto;display:block;filter:drop-shadow(0 1px 5px rgba(0,0,0,.5))}
.brand .yr{font-family:var(--disp);font-size:22px;line-height:.86;color:var(--neon);text-shadow:0 0 14px var(--neon-glow)}
.brand .sub{margin-left:auto;font-size:11.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.daytabs{display:flex;gap:6px;padding:2px 12px 10px}
.daytab{flex:1;min-width:0;white-space:nowrap;padding:8px 6px;border-radius:11px;border:1px solid var(--glassb);background:var(--glass);backdrop-filter:blur(8px);font-family:var(--disp);font-size:12.5px;letter-spacing:.02em;text-transform:uppercase;text-align:center;color:var(--muted);transition:.15s}
.daytab.active{background:linear-gradient(135deg,var(--neon),var(--neon2));color:var(--neon-ink);border-color:transparent;box-shadow:0 0 24px var(--neon-glow),0 0 0 1px var(--neon)}

/* ---------- Filters ---------- */
.filters{padding:10px 12px 2px;display:flex;flex-direction:column;gap:8px}
.search{width:100%;padding:10px 14px;border-radius:12px;border:1px solid var(--glassb);background:var(--glass);backdrop-filter:blur(8px);color:var(--ink);font-size:14px;font-family:inherit;font-weight:500}
.search:focus{outline:none;border-color:var(--neon);box-shadow:0 0 0 3px var(--neon-glow),0 0 18px var(--neon-glow)}
.search::placeholder{color:var(--faint)}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.chip{white-space:nowrap;padding:6px 11px;border-radius:999px;border:1px solid var(--glassb);background:var(--glass);backdrop-filter:blur(8px);font-size:12px;font-weight:600;color:var(--muted);display:flex;align-items:center;gap:6px;transition:.15s}
.chip .dot{width:9px;height:9px;border-radius:50%;box-shadow:0 0 8px currentColor,0 0 3px currentColor}
.chip.active{color:var(--ink);border-color:currentColor;background:var(--glass2);box-shadow:0 0 16px -4px currentColor}
.chip.favchip.active{background:linear-gradient(135deg,var(--neon),var(--neon2));color:var(--neon-ink);border-color:transparent;box-shadow:0 0 18px var(--neon-glow)}

/* ---------- List ---------- */
main{padding:6px 14px 24px}
.thead{display:flex;align-items:center;gap:9px;margin:15px 2px 8px;color:var(--ink);font-family:var(--disp);font-size:13.5px;letter-spacing:.03em}
.thead::before{content:"";width:6px;height:6px;border-radius:2px;background:var(--neon);box-shadow:0 0 8px var(--neon-glow)}
.thead::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.card{position:relative;display:flex;gap:12px;padding:11px;background:linear-gradient(180deg,var(--glass2),var(--glass));backdrop-filter:blur(10px);border:1px solid var(--glassb);border-radius:14px;margin-bottom:8px;transition:transform .12s,border-color .15s,box-shadow .15s}
.card:active{transform:scale(.99)}
.card.live{border-color:var(--neon);box-shadow:0 0 0 1px var(--neon),0 0 26px -6px var(--neon-glow)}
.art{width:52px;height:52px;border-radius:10px;object-fit:cover;background:var(--card3);flex-shrink:0;font-size:0;box-shadow:0 0 0 1.5px var(--sc,var(--line2)),0 5px 12px -8px rgba(0,0,0,.7)}
.art.ph{display:flex;align-items:center;justify-content:center;font-size:19px;color:var(--faint)}
.info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.rowtop{display:flex;align-items:center;gap:8px}
.time{font-family:var(--disp);font-size:15px;letter-spacing:.01em;color:var(--ink);font-variant-numeric:tabular-nums}
.stagebadge{font-family:var(--disp);font-size:9.5px;letter-spacing:.05em;padding:2px 6px;border-radius:5px;color:#0b0b10}
.livepill{font-size:9px;font-weight:800;letter-spacing:.04em;background:var(--neon);color:var(--neon-ink);padding:2px 6px;border-radius:5px;box-shadow:0 0 10px var(--neon-glow);animation:pulse 1.8s infinite}
@keyframes pulse{50%{opacity:.6}}
.soonpill{font-size:9px;font-weight:800;letter-spacing:.04em;background:var(--card3);color:var(--ink);padding:2px 6px;border-radius:5px}
.name{font-size:15px;font-weight:700;letter-spacing:-.01em;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11.5px;color:var(--muted);font-weight:500;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;gap:7px;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:9px;border:1px solid var(--glassb);background:var(--glass);backdrop-filter:blur(8px);font-size:12px;font-weight:600;text-decoration:none;transition:.12s}
.btn:active{transform:scale(.96)}
.btn .gl{font-size:10px}
.btn.play.playing{background:linear-gradient(135deg,var(--neon),var(--neon2));color:var(--neon-ink);border-color:transparent;box-shadow:0 0 16px var(--neon-glow)}
.btn.sp{border-color:rgba(30,215,96,.4);color:#fff;background:rgba(30,215,96,.16)}
.btn.sp .spico{border-radius:50%}
.btn:disabled{opacity:.35}
.fav{position:absolute;top:9px;right:9px;width:32px;height:32px;border-radius:50%;border:1px solid var(--glassb);background:var(--glass);backdrop-filter:blur(8px);font-size:15px;display:flex;align-items:center;justify-content:center;transition:.12s}
.fav:active{transform:scale(.9)}
.fav.on{background:linear-gradient(135deg,var(--neon),var(--neon2));color:var(--neon-ink);border-color:transparent;box-shadow:0 0 18px var(--neon-glow)}
.empty{text-align:center;color:var(--muted);padding:56px 20px;line-height:1.7}
.empty b{color:var(--ink);font-weight:700}

/* ---------- Clash banner (Mitt schema) ---------- */
.clash{display:flex;gap:10px;align-items:flex-start;background:linear-gradient(180deg,rgba(255,120,60,.12),rgba(255,120,60,.05));border:1px solid rgba(255,140,80,.35);color:#ffc7a6;border-radius:14px;padding:12px 14px;margin:8px 2px 14px;font-size:13px;line-height:1.5}

/* ---------- Map (clickable image) ---------- */
.mapouter{position:relative;margin:8px 0 10px}
.mapimg-wrap{position:relative;border-radius:18px;overflow:auto;border:1px solid var(--line);box-shadow:0 12px 34px -14px rgba(0,0,0,.85);line-height:0;-webkit-overflow-scrolling:touch}
.mapzoom{width:100%;transform-origin:0 0;transition:transform .18s}
.mapimg{width:100%;display:block}
.zoomctrl{position:absolute;right:10px;bottom:12px;display:flex;gap:6px;z-index:6}
.zoombtn{min-width:38px;height:38px;padding:0 10px;border-radius:11px;border:1px solid var(--line2);background:rgba(8,9,13,.55);backdrop-filter:blur(8px);color:var(--ink);font-size:20px;font-weight:700;display:flex;align-items:center;justify-content:center;opacity:.72;transition:.12s}
.zoombtn.wide{font-family:var(--disp);font-size:13px;letter-spacing:.03em}
.zoombtn:active{opacity:1;transform:scale(.94)}
.hot{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column-reverse;align-items:center;gap:5px;background:none;border:none;padding:0;cursor:pointer}
.hot::before{content:"";width:46px;height:46px;border-radius:50%;border:3px solid var(--sc);background:radial-gradient(circle,color-mix(in srgb,var(--sc) 22%,transparent),transparent 70%);box-shadow:0 0 22px var(--sc),0 0 8px var(--sc),0 2px 6px #000a;transition:.15s}
.hot:active::before{transform:scale(.92)}
.hot .hlbl{font-family:var(--disp);font-size:12.5px;letter-spacing:.02em;color:#0b0b10;background:var(--sc);padding:2px 9px;border-radius:8px;white-space:nowrap;box-shadow:0 0 12px var(--sc),0 2px 5px #000a}
.hot .hlbl b{font-weight:400;opacity:.85}
.hot.sel::before{width:56px;height:56px;background:radial-gradient(circle,color-mix(in srgb,var(--sc) 45%,transparent),transparent 68%);box-shadow:0 0 0 4px color-mix(in srgb,var(--sc) 45%,transparent),0 0 30px var(--sc);animation:hotpulse 1.6s infinite}
@keyframes hotpulse{50%{box-shadow:0 0 0 9px transparent,0 0 34px var(--sc)}}
.hot.sel .hlbl{box-shadow:0 0 18px var(--sc),0 2px 5px #000a}
.maphint{font-size:12px;color:var(--muted);padding:0 4px 8px;line-height:1.5}
.mapbtns{display:flex;gap:9px;margin:4px 0 10px}
.mapbtns .btn{flex:1;justify-content:center;padding:13px;font-size:14px}
.stagepanel{background:linear-gradient(180deg,var(--glass2),var(--glass));backdrop-filter:blur(10px);border:1px solid var(--glassb);border-radius:18px;padding:16px;margin-top:6px}
.stagepanel h3{display:flex;align-items:center;gap:9px;font-family:var(--disp);font-size:20px;letter-spacing:.02em}
.mini{display:flex;align-items:center;gap:11px;padding:11px 2px;border-bottom:1px solid var(--line)}
.mini:last-child{border-bottom:0}
.mini .time{width:56px}
.mini .mname{flex:1;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini .mfav{width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:var(--card2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.mini .mfav.on{background:var(--neon);color:var(--neon-ink);border-color:var(--neon)}

/* ---------- Mini player ---------- */
#player{position:fixed;left:0;right:0;bottom:calc(var(--nav-h) + var(--safe-b));z-index:45;transform:translateY(140%);transition:transform .28s cubic-bezier(.2,.8,.2,1);background:rgba(24,26,38,.86);backdrop-filter:blur(18px);border-top:1px solid var(--line2)}
#player.show{transform:none}
.pbar{height:3px;background:var(--line)}
.pfill{height:100%;width:0;background:var(--neon);box-shadow:0 0 10px var(--neon-glow)}
.pinner{display:flex;align-items:center;gap:11px;padding:8px 14px}
.pinner .art{width:40px;height:40px;border-radius:9px;box-shadow:0 0 0 1px var(--line2)}
.pmeta{flex:1;min-width:0}
.pname{font-weight:700;font-size:15px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ptrack{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.pbtn{width:42px;height:42px;border-radius:50%;border:none;background:var(--neon);color:var(--neon-ink);font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 0 16px var(--neon-glow)}
.pclose{background:none;border:none;color:var(--muted);font-size:24px;width:30px;flex-shrink:0}

/* ---------- Bottom nav ---------- */
nav{position:fixed;left:0;right:0;bottom:0;z-index:50;height:calc(var(--nav-h) + var(--safe-b));padding-bottom:var(--safe-b);display:flex;background:rgba(14,15,22,.9);backdrop-filter:blur(18px);border-top:1px solid var(--line)}
.navbtn{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;background:none;border:none;color:var(--faint);font-size:11px;font-weight:600;letter-spacing:.01em;transition:.15s}
.navbtn .ic{font-size:18px;line-height:1;filter:grayscale(1) opacity(.7);transition:.15s}
.navbtn.active{color:var(--neon)}
.navbtn.active .ic{filter:none;transform:translateY(-1px)}
.navbtn .badge{position:absolute;top:8px;left:50%;margin-left:6px;background:var(--fla);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:9px;padding:0 4px;display:flex;align-items:center;justify-content:center;box-shadow:0 0 8px rgba(255,77,141,.5)}

.note{font-size:12px;color:var(--muted);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:6px 2px 16px;line-height:1.6}
.note b{color:var(--ink);font-weight:700}

/* sluttid på kort */
.tend{font-size:12.5px;color:var(--muted);font-weight:600;margin-left:1px}

/* ---------- Nu-vy ---------- */
.nucount{background:linear-gradient(180deg,var(--glass2),var(--glass));backdrop-filter:blur(10px);border:1px solid var(--glassb);border-radius:14px;padding:14px;margin:8px 2px 8px;text-align:center}
.nucount.live{border-color:var(--neon);box-shadow:0 0 30px -6px var(--neon-glow)}
.nulbl{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.nubig{font-family:var(--disp);font-size:23px;line-height:1.05;margin:5px 0 4px;letter-spacing:.01em}
.nucount.live .nubig{color:var(--neon);text-shadow:0 0 18px var(--neon-glow)}
.nusub{font-size:13px;color:var(--ink);font-weight:600}
.nustage{background:var(--card);border:1px solid var(--line);border-left:3px solid;border-radius:12px;padding:9px 12px;margin-bottom:7px}
.nustagehd{font-family:var(--disp);font-size:15px;letter-spacing:.03em;margin-bottom:3px}
.nunow{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.nunext{font-size:12.5px;color:var(--muted);margin-top:3px}

/* ---------- Rutschema (grid) ---------- */
.gridwrap{overflow-x:auto;margin:4px 0 8px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
.grid{display:flex;min-width:640px}
.gcol{flex:1;min-width:112px;border-right:1px solid var(--line)}
.gcol:last-child{border-right:0}
.gaxiscol{flex:0 0 46px;min-width:46px;position:sticky;left:0;z-index:3;background:var(--bg2)}
.gcolhd{position:sticky;top:0;z-index:2;height:32px;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:12px;color:#0b0b10;letter-spacing:.03em}
.gaxishd{background:var(--bg2)}
.gaxis{position:relative}
.gh{position:absolute;right:5px;transform:translateY(-6px);font-size:10px;color:var(--muted);font-variant-numeric:tabular-nums}
.gcolbody{position:relative;background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px);background-repeat:repeat-y}
.gblock{position:absolute;left:3px;right:3px;border:none;border-radius:8px;color:#0b0b10;text-align:left;padding:4px 6px;overflow:hidden;display:flex;flex-direction:column;gap:1px;box-shadow:0 1px 3px #0006;cursor:pointer}
.gblock.on{outline:2px solid var(--neon);outline-offset:1px}
.gblock.live{box-shadow:0 0 0 2px #fff,0 0 12px var(--neon-glow)}
.gbt{font-size:10px;font-weight:800;opacity:.9;font-variant-numeric:tabular-nums}
.gbn{font-size:12px;font-weight:800;line-height:1.05;overflow:hidden;text-overflow:ellipsis}
.gnow{position:absolute;left:0;right:0;height:2px;background:var(--neon);box-shadow:0 0 8px var(--neon-glow);z-index:1}

/* ---------- Praktiskt / Info ---------- */
.infocard{background:linear-gradient(180deg,var(--glass2),var(--glass));backdrop-filter:blur(10px);border:1px solid var(--glassb);border-radius:14px;padding:13px;margin-bottom:8px}
.infocard h3{font-family:var(--disp);font-size:15px;letter-spacing:.02em;margin-bottom:8px}
.irow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.irow:last-of-type{border-bottom:0}
.irow b{font-weight:700;font-variant-numeric:tabular-nums;text-align:right}
.isub{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:8px}
.infocard .btn{width:100%}
.sowmeta{font-size:12px;color:var(--muted);margin:0 2px 10px}
.sowvh{font-family:var(--disp);font-size:14px;color:var(--neon);letter-spacing:.03em;margin:2px 0 6px;text-shadow:0 0 10px var(--neon-glow)}
.sowh{float:right;font-family:var(--sans);font-size:11px;color:var(--muted);font-weight:600;text-shadow:none}
.sowsub{font-family:var(--sans);font-size:12px;color:var(--muted);font-weight:600}
.sowpre{font-size:11px;font-weight:800;color:var(--ink);margin:0 0 4px;letter-spacing:.03em;text-transform:uppercase}
.sowrow{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:14px}
.sowrow:last-child{border-bottom:0}
.sowt{flex:0 0 48px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.sown{flex:1;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sowsp{flex:0 0 auto;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;border:1px solid rgba(30,215,96,.4);background:rgba(30,215,96,.12)}
.sowsp svg{width:16px;height:16px;border-radius:50%}
</style>

// sortMin = startMin men efter midnatt (<06:00) +1440 så kvällen sorteras i rätt
// följd (park 12–23 → Stay Out West 22–03). estEnd/endMin i sortMin-rymd.
function computeEnds(){
  SETS.forEach(s=>{ s.startMin=mins(s.t); s.sortMin=s.startMin + (s.startMin<360?1440:0); });
  const groups={};
  SETS.forEach(s=>{(groups[s.d+'|'+s.stage]=groups[s.d+'|'+s.stage]||[]).push(s);});
  Object.values(groups).forEach(arr=>{
    arr.sort((a,b)=>a.sortMin-b.sortMin);
    arr.forEach((s,i)=>{
      const next = i<arr.length-1 ? arr[i+1].sortMin : null;
      s.endMin = next!==null ? next : s.sortMin+90;
      const dur = (i===arr.length-1) ? 90 : 60;
      let e = s.sortMin + dur; if(next!==null) e = Math.min(e, next);
      s.estEnd = e;
    });
  });
}
// Lägg in Stay Out West-passen (klubbkvällarna) som vanliga set i varje dag.
function addSOW(){
  if(SETS.__sowAdded) return; SETS.__sowAdded=true;
  SOW.forEach((day,d)=>day.forEach(v=>{
    const push=(t,name,room)=>SETS.push({d, stage:v.v, t, name, sow:true, room:room||'', vhours:v.h, pre:v.pre||''});
    if(v.rooms) v.rooms.forEach(r=>r.acts.forEach(a=>push(a[0],a[1],r.r)));
    else (v.acts||[]).forEach(a=>push(a[0],a[1]));
  }));
}

/* ---------- live status ---------- */
function nowInfo(){
  const t=new Date();
  const iso=t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')+'-'+String(t.getDate()).padStart(2,'0');
  const dayIdx=DAYS.findIndex(d=>d.date===iso);
  return {dayIdx, nowMin:t.getHours()*60+t.getMinutes()};
}
function statusOf(s){
  const {dayIdx,nowMin}=nowInfo();
  if(dayIdx!==s.d) return null;
  if(nowMin>=s.startMin && nowMin<s.endMin) return 'live';
  if(s.startMin-nowMin>0 && s.startMin-nowMin<=30) return 'soon';
  return null;
}

/* ---------- audio player: topp-3-medley med Spotify-liknande crossfade ---------- */
const CLIP=14, FADE=4;                 // sek per låt, sek crossfade (equal-power, Spotify-likt)
const AP=[new Audio(), new Audio()]; AP.forEach(a=>a.preload='auto');
let curPlay=null, curSet=null, medley=[], medIdx=0, act=0, fading=false, fadeTimer=null;
const A=()=>AP[act], other=()=>AP[act^1];
function isPlaying(id){ return curPlay===id && A() && !A().paused; }
function clipsOf(s){ return (s.top3&&s.top3.length)?s.top3 : (s.preview?[{track:s.track,preview:s.preview,art:s.art}]:[]); }
function updPMeta(){
  const c=medley[medIdx]||{};
  $('#pname').textContent=curSet?curSet.name:'';
  const pos = medley.length>1 ? `  ·  ${medIdx+1}/${medley.length}` : '';
  $('#ptrack').textContent=(c.track?('♪ '+c.track):'')+pos;
  const pa=$('#part'); const art=c.art||(curSet&&curSet.art);
  if(art){pa.src=art;pa.classList.remove('ph');pa.textContent='';} else {pa.removeAttribute('src');pa.classList.add('ph');}
}
function preloadNext(){ if(medIdx+1<medley.length){ const n=other(); if(n.src!==medley[medIdx+1].preview){ n.src=medley[medIdx+1].preview; n.load(); } } }
function stopFade(){ if(fadeTimer){clearInterval(fadeTimer);fadeTimer=null;} fading=false; }
function startClip(i){ medIdx=i; const a=A(); if(a.src!==medley[i].preview) a.src=medley[i].preview; a.volume=1; a.currentTime=0; a.play().catch(()=>{}); updPMeta(); preloadNext(); syncPBtn(); }
function crossfade(){
  if(fading || medIdx+1>=medley.length) return;
  fading=true;
  const from=A(), to=other();
  if(to.src!==medley[medIdx+1].preview) to.src=medley[medIdx+1].preview;
  to.currentTime=0; to.volume=0;
  let toStarted=false;
  const t0=performance.now();
  // Sekventiell övergång: A tonas UT först, B tonas IN sen (liten överlapp) → aldrig
  // två låtar starkt samtidigt = ingen krock, men ändå mjukt utan tyst lucka.
  fadeTimer=setInterval(()=>{
    const p=Math.min((performance.now()-t0)/(FADE*1000),1);
    from.volume=Math.max(0, 1 - p/0.55);            // ute vid ~55% av faden
    if(p>=0.45){                                     // in börjar vid ~45%
      if(!toStarted){ toStarted=true; to.play().catch(()=>{}); }
      to.volume=Math.min(1, (p-0.45)/0.55);
    }
    if(p>=1){ clearInterval(fadeTimer); fadeTimer=null; from.pause(); from.volume=1; to.volume=1; act^=1; medIdx++; fading=false; updPMeta(); preloadNext(); syncPBtn(); }
  },30);
}
function fadeOutEnd(){                  // mjuk uttoning på sista låten
  if(fading) return; fading=true;
  const from=A(), t0=performance.now();
  fadeTimer=setInterval(()=>{
    const p=Math.min((performance.now()-t0)/(FADE*1000),1);
    from.volume=Math.cos(p*Math.PI/2);
    if(p>=1){ clearInterval(fadeTimer); fadeTimer=null; from.pause(); from.volume=1; fading=false; $('#pfill').style.width='100%'; syncPBtn(); }
  },30);
}
function playSet(s){
  const id=idOf(s);
  if(curPlay===id){ if(A().paused){A().play();} else {stopFade();AP.forEach(a=>a.pause());} syncPBtn(); return; }
  const clips=clipsOf(s); if(!clips.length) return;
  stopFade(); AP.forEach(a=>{a.pause();a.volume=1;});
  curPlay=id; curSet=s; medley=clips; act=0; medIdx=0;
  $('#player').classList.add('show'); document.documentElement.style.setProperty('--player-h','58px');
  startClip(0); render();
}
function syncPBtn(){ $('#pbtn').textContent=A().paused?'▶':'❚❚'; document.querySelectorAll('.btn.play').forEach(b=>b.classList.toggle('playing', isPlaying(b.dataset.id))); }
function onTime(e){
  if(e.target!==A()) return;
  const a=A(), multi=medley.length>1;
  const total = multi ? medley.length*CLIP : (a.duration||30);
  const elapsed = multi ? (medIdx*CLIP + Math.min(a.currentTime,CLIP)) : a.currentTime;
  $('#pfill').style.width = (total?Math.min(elapsed/total,1)*100:0)+'%';
  if(multi){
    if(medIdx<medley.length-1 && a.currentTime>=CLIP-FADE) crossfade();
    else if(medIdx===medley.length-1 && a.currentTime>=CLIP-FADE) fadeOutEnd();
  }
}
function onEnd(e){
  if(e.target!==A()) return;
  if(medley.length>1 && medIdx<medley.length-1 && !fading){ act^=1; startClip(medIdx+1); }
  else { $('#pfill').style.width='0%'; syncPBtn(); }
}
AP.forEach(a=>{ a.addEventListener('timeupdate',onTime); a.addEventListener('ended',onEnd); a.addEventListener('play',syncPBtn); a.addEventListener('pause',syncPBtn); });
$('#pbtn').onclick=()=>{ if(A().paused){A().play();} else {stopFade();AP.forEach(a=>a.pause());} syncPBtn(); };
$('#pclose').onclick=()=>{stopFade();AP.forEach(a=>{a.pause();a.volume=1;});$('#player').classList.remove('show');document.documentElement.style.setProperty('--player-h','0px');curPlay=null;curSet=null;medley=[];render();};

/* ---------- kalender-export (.ics) ---------- */
function icsStamp(d,min){
  const base=new Date(DAYS[d].date+'T00:00:00');
  base.setMinutes(base.getMinutes()+min);
  const p=n=>String(n).padStart(2,'0');
  return base.getFullYear()+p(base.getMonth()+1)+p(base.getDate())+'T'+p(base.getHours())+p(base.getMinutes())+'00';
}
function downloadICS(d){
  const favs=SETS.filter(s=>FAV.has(idOf(s))&&s.d===d).sort((a,b)=>a.startMin-b.startMin);
  if(!favs.length) return;
  const esc2=v=>(v||'').replace(/([,;\\])/g,'\\$1');
  let ics='BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//WOW2026//SchemaApp//SV\r\nCALSCALE:GREGORIAN\r\n';
  favs.forEach((s,i)=>{
    ics+='BEGIN:VEVENT\r\nUID:wow2026-'+d+'-'+i+'@wow\r\n'
      +'DTSTART:'+icsStamp(d,s.startMin)+'\r\nDTEND:'+icsStamp(d,s.estEnd)+'\r\n'
      +'SUMMARY:'+esc2(s.name+' — '+s.stage)+'\r\nLOCATION:'+esc2(s.stage+', Slottsskogen')+'\r\n'
      +'DESCRIPTION:'+esc2('Way Out West 2026 · sluttid uppskattad')+'\r\nEND:VEVENT\r\n';
  });
  ics+='END:VCALENDAR\r\n';
  const url=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));
  const a=document.createElement('a'); a.href=url; a.download='wow2026-'+DAYS[d].date+'.ics';
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500);
}

/* ---------- render ---------- */
function render(){
  renderDayTabs(); renderNav();
  const m=$('#main');
  if(state.view==='schema') m.innerHTML=viewSchema();
  else if(state.view==='nu') m.innerHTML=viewNu();
  else if(state.view==='info') m.innerHTML=viewInfo();
  else if(state.view==='karta') m.innerHTML=viewKarta();
  else m.innerHTML=viewMitt();
  bind();
  syncPBtn();
  saveUI();
}

function renderDayTabs(){
  $('#daytabs').innerHTML=DAYS.map(d=>`<button class="daytab ${d.k===state.day?'active':''}" data-day="${d.k}">${d.lbl}</button>`).join('');
}
function renderNav(){
  document.querySelectorAll('.navbtn').forEach(b=>b.classList.toggle('active',b.dataset.view===state.view));
  // favourite count badge
  const nb=document.querySelector('.navbtn[data-view="mitt"]');
  nb.querySelector('.badge')?.remove();
  if(FAV.size){ const s=document.createElement('span'); s.className='badge'; s.textContent=FAV.size; nb.appendChild(s); }
}

function cardHTML(s){
  const st=STAGES[s.stage] || {hex:'#8b7bff', desc:'Stay Out West'};
  const id=idOf(s), status=statusOf(s), fav=FAV.has(id);
  const artHtml = s.art
    ? `<img class="art" src="${s.art}" alt="" loading="lazy">`
    : `<div class="art ph">${s.sow?'🌙':'♪'}</div>`;
  const pill = status==='live'?'<span class="livepill">SPELAR NU</span>':status==='soon'?'<span class="soonpill">STRAX</span>':'';
  const badge = (s.sow?'🌙 ':'')+s.stage.toUpperCase();
  const meta = s.sow
    ? `${s.room?esc(s.room)+' · ':''}Klubb${s.pre?(' · '+esc(s.pre)):''} · ${esc(s.vhours||'')}`
    : `${esc(s.genre||st.desc)}${s.note?(' · '+esc(s.note)):''}`;
  const playBtn = s.preview
    ? `<button class="btn play ${curPlay===id?'playing':''}" data-id="${id}" data-play="${id}"><span class="gl">${isPlaying(id)?'❚❚':'▶'}</span> Smakprov</button>` : '';
  return `<div class="card ${status==='live'?'live':''} ${s.sow?'sowc':''}" style="--sc:${st.hex}">
    ${artHtml}
    <div class="info">
      <div class="rowtop"><span class="time">${fmt(s.t)}</span>
        <span class="stagebadge" style="background:${st.hex};box-shadow:0 0 12px -1px ${st.hex}">${badge}</span>${pill}</div>
      <div class="name">${esc(s.name)}</div>
      <div class="meta">${meta}</div>
      <div class="actions">
        ${playBtn}
        <a class="btn sp" href="${spotify(s.name)}" target="_blank" rel="noopener" aria-label="Öppna i Spotify">${SP_ICON}<span>Spotify</span></a>
      </div>
    </div>
    <button class="fav ${fav?'on':''}" data-fav="${id}" aria-label="Favorit">${fav?'★':'☆'}</button>
  </div>`;
}

function filtered(){
  const searching = !!state.q.trim();       // sök över ALLA dagar, annars vald dag
  return SETS
    .filter(s=> searching ? true : s.d===state.day)
    .filter(s=>state.stageFilter==='all'||s.stage===state.stageFilter)
    .filter(s=>!state.favOnly||FAV.has(idOf(s)))
    .filter(s=>!state.q||(s.name+' '+(s.genre||'')+' '+s.stage).toLowerCase().includes(state.q.toLowerCase()))
    .sort((a,b)=> searching ? (a.d-b.d || a.startMin-b.startMin)
                            : (a.startMin-b.startMin || STAGE_ORDER.indexOf(a.stage)-STAGE_ORDER.indexOf(b.stage)));
}

function sowScheduleHTML(d){
  const nights=['natten mot fredag','natten mot lördag','natten mot söndag'];
  const row=a=>`<div class="sowrow"><span class="sowt">${a[0]}</span><span class="sown">${esc(a[1])}</span><a class="sowsp" href="${spotify(a[1])}" target="_blank" rel="noopener" aria-label="Öppna i Spotify">${SP_ICON}</a></div>`;
  const cards=(SOW[d]||[]).map(v=>{
    let inner='';
    if(v.rooms) inner=v.rooms.map(r=>`<div class="sowvh">${esc(v.v)} – ${esc(r.r)}<span class="sowh">${v.h}</span></div>`+r.acts.map(row).join('')).join('');
    else inner=`<div class="sowvh">${esc(v.v)}${v.sub?' · '+esc(v.sub):''}<span class="sowh">${v.h}</span></div>`+(v.pre?`<div class="sowpre">${esc(v.pre)}</div>`:'')+(v.acts||[]).map(row).join('');
    return `<div class="infocard sowcard">${inner}</div>`;
  }).join('');
  return `<div class="thead" style="margin-top:22px">🌙 Stay Out West</div>
    <div class="sowmeta">${nights[d]} · i stan · 18 år · cirkatider</div>${cards}`;
}
function gridHTML(d){
  const sets=SETS.filter(s=>s.d===d);
  if(!sets.length) return '<div class="empty">Inget denna dag.</div>';
  const t0=Math.floor(Math.min(...sets.map(s=>s.startMin))/60)*60;
  const t1=Math.ceil(Math.max(...sets.map(s=>s.estEnd))/60)*60;
  const ppm=1.15, HOUR=60*ppm, H=(t1-t0)*ppm;
  const {dayIdx,nowMin}=nowInfo();
  let axis='';
  for(let m=t0;m<=t1;m+=60) axis+=`<div class="gh" style="top:${(m-t0)*ppm}px">${hhmm(m)}</div>`;
  const nowTop=(dayIdx===d && nowMin>=t0 && nowMin<=t1) ? (nowMin-t0)*ppm : null;
  let cols='';
  STAGE_ORDER.forEach(st=>{
    let blocks='';
    sets.filter(s=>s.stage===st).forEach(s=>{ const id=idOf(s),fav=FAV.has(id),live=statusOf(s)==='live';
      const top=(s.startMin-t0)*ppm, h=Math.max((s.estEnd-s.startMin)*ppm,28);
      blocks+=`<button class="gblock ${fav?'on':''} ${live?'live':''}" data-fav="${id}" style="top:${top}px;height:${h}px;background:${STAGES[st].hex}">
        <span class="gbt">${s.t}${fav?' ★':''}</span><span class="gbn">${esc(s.name)}</span></button>`;
    });
    const nl=nowTop!=null?`<div class="gnow" style="top:${nowTop}px"></div>`:'';
    cols+=`<div class="gcol"><div class="gcolhd" style="background:${STAGES[st].hex}">${st}</div>
      <div class="gcolbody" style="height:${H}px;background-size:100% ${HOUR}px">${nl}${blocks}</div></div>`;
  });
  return `<div class="gridwrap"><div class="grid">
      <div class="gcol gaxiscol"><div class="gcolhd gaxishd"></div><div class="gaxis" style="height:${H}px">${axis}</div></div>
      ${cols}
    </div></div>
    <div class="note">Scener som kolumner, tid nedåt (efter starttid). Tryck på ett pass för att ★-märka.</div>`;
}

function viewSchema(){
  const toggle=`<div class="chips" style="margin-bottom:4px">
    <button class="chip ${state.layout==='list'?'active':''}" data-layout="list">☰ Lista</button>
    <button class="chip ${state.layout==='grid'?'active':''}" data-layout="grid">▦ Rutschema</button>
  </div>`;
  if(state.layout==='grid') return `<div class="filters" style="padding-bottom:4px">${toggle}</div>`+gridHTML(state.day);
  const chips = `<div class="chips" id="chips">
    <button class="chip ${state.stageFilter==='all'?'active':''}" data-stage="all">Alla scener</button>
    ${STAGE_ORDER.map(st=>`<button class="chip ${state.stageFilter===st?'active':''}" data-stage="${st}" style="${state.stageFilter===st?('color:'+STAGES[st].hex):''}"><span class="dot" style="background:${STAGES[st].hex}"></span>${st}</button>`).join('')}
    <button class="chip favchip ${state.favOnly?'active':''}" data-favonly="1">★ Favoriter</button>
  </div>`;
  const filters=`<div class="filters">
    ${toggle}
    <input class="search" id="search" placeholder="Sök artist, genre…" value="${esc(state.q)}">
    ${chips}
  </div>`;
  const searching = !!state.q.trim();
  const list=filtered();
  let body='';
  if(searching) body+=`<div class="note" style="margin:8px 2px 4px">🔎 Söker i <b>alla tre dagar</b> — resultat grupperade per dag.</div>`;
  if(!list.length){ body+=`<div class="empty">Inga träffar.<br><b>${state.favOnly?'Stjärnmärk artister så dyker de upp här.':'Prova ett annat namn eller scen.'}</b></div>`; }
  else if(searching){
    let lastDay=null;
    list.forEach(s=>{ if(s.d!==lastDay){ body+=`<div class="thead">${DAYS[s.d].lbl}</div>`; lastDay=s.d; } body+=cardHTML(s); });
  } else {
    let lastHour=null;
    list.forEach(s=>{ const h=s.t.slice(0,2)+':00'; if(h!==lastHour){ body+=`<div class="thead">${h}</div>`; lastHour=h; } body+=cardHTML(s); });
  }
  // Stay Out West som egen sektion sist på dagen (bara i normal dagvy)
  const sow = (!searching && !state.favOnly && state.stageFilter==='all') ? sowScheduleHTML(state.day) : '';
  return filters+body+sow+`
    <div class="note">🎧 <b>Smakprov</b> = ~30 sek klipp via Apple (ofta hooken, inte garanterat exakt refrängen). Spotify tog bort sina egna förhandsklipp 2024 — därför öppnar <b>Spotify</b>-knappen artisten direkt i appen istället.</div>`;
}

function viewMitt(){
  const favs = SETS.filter(s=>FAV.has(idOf(s)) && s.d===state.day).sort((a,b)=>a.startMin-b.startMin);
  const filters=`<div class="filters"><div class="chips">${DAYS.map(d=>`<button class="chip ${d.k===state.day?'active':''}" data-day="${d.k}" ${d.k===state.day?'style="color:var(--accent)"':''}>${d.lbl} (${SETS.filter(s=>FAV.has(idOf(s))&&s.d===d.k).length})</button>`).join('')}</div></div>`;
  if(!FAV.size) return filters+`<div class="empty">Ditt schema är tomt.<br><b>Tryck ☆ på en artist i Schema-vyn.</b></div>`;
  if(!favs.length) return filters+`<div class="empty">Inga favoriter denna dag.<br><b>Byt dag ovan eller stjärnmärk fler.</b></div>`;
  // clash detection
  let clashes=[];
  for(let i=0;i<favs.length;i++)for(let j=i+1;j<favs.length;j++){
    if(favs[i].stage!==favs[j].stage && favs[i].startMin<favs[j].estEnd && favs[j].startMin<favs[i].estEnd)
      clashes.push([favs[i],favs[j]]);
  }
  let banner='';
  if(clashes.length){
    const c=clashes.map(([a,b])=>`${esc(a.name)} (${a.t}) ✕ ${esc(b.name)} (${b.t})`).slice(0,4).join('<br>');
    banner=`<div class="clash">⚠️ <div><b>Krockar (${clashes.length}):</b><br>${c}</div></div>`;
  }
  const calbtn=`<div class="mapbtns" style="margin:2px 2px 10px"><button class="btn" id="calbtn" style="flex:1;justify-content:center;padding:12px">📅 Lägg till dagen i kalendern</button></div>`;
  let body=''; let lastHour=null;
  favs.forEach(s=>{ const h=s.t.slice(0,2)+':00'; if(h!==lastHour){ body+=`<div class="thead">${h}</div>`; lastHour=h; } body+=cardHTML(s); });
  return filters+banner+calbtn+body;
}

/* ---------- Praktiskt / Info ---------- */
let WEATHER=null, WEATHER_TS=0, WEATHER_TRIED=false; // WEATHER: null | 'error' | daily-objekt
function loadWeather(){
  // 1) visa senast sparade direkt (funkar offline + instant)
  if(WEATHER===null){ try{ const c=JSON.parse(localStorage.getItem('wow26_weather')||'null'); if(c&&c.data){ WEATHER=c.data; WEATHER_TS=c.ts; } }catch(e){} }
  // 2) hämta färskt EN gång per sidladdning (WEATHER_TRIED nollställs vid reload)
  if(WEATHER_TRIED) return; WEATHER_TRIED=true;
  fetch('https://api.open-meteo.com/v1/forecast?latitude=57.686&longitude=11.949&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FStockholm&start_date=2026-08-13&end_date=2026-08-15')
    .then(r=>r.ok?r.json():Promise.reject()).then(j=>{
      if(j&&j.daily&&j.daily.time){ WEATHER=j.daily; WEATHER_TS=Date.now(); try{localStorage.setItem('wow26_weather',JSON.stringify({data:WEATHER,ts:WEATHER_TS}));}catch(e){} }
      else if(WEATHER===null) WEATHER='error';
    })
    .catch(()=>{ if(WEATHER===null) WEATHER='error'; })
    .finally(()=>{ if(state.view==='info')render(); });
}
function wcode(c){
  if(c===0) return '☀️'; if(c<=3) return '⛅'; if(c<=48) return '🌫️';
  if(c<=67) return '🌧️'; if(c<=77) return '❄️'; if(c<=82) return '🌦️'; return '⛈️';
}
function viewInfo(){
  loadWeather();
  const hours=`<div class="infocard"><h3>🕑 Öppettider</h3>
    <div class="irow"><span>Torsdag 13/8</span><b>14:00–23:00</b></div>
    <div class="irow"><span>Fredag 14/8</span><b>12:00–01:00</b></div>
    <div class="irow"><span>Lördag 15/8</span><b>12:00–01:00</b></div>
    <div class="isub">Tider för Slottsskogen. Kvällarna fortsätter på Stay Out West i stan.</div></div>`;
  let w;
  if(WEATHER===null) w='<div class="isub">Hämtar väder…</div>';
  else if(WEATHER==='error') w='<div class="isub">Väder inte hämtat än — anslut till internet en gång så sparas prognosen för offline-bruk.</div>';
  else { const lbl=['Torsdag','Fredag','Lördag'];
    w=WEATHER.time.map((t,i)=>
      `<div class="irow"><span>${wcode(WEATHER.weathercode[i])} ${lbl[i]||t}</span><b>${Math.round(WEATHER.temperature_2m_max[i])}° / ${Math.round(WEATHER.temperature_2m_min[i])}° · ${WEATHER.precipitation_probability_max[i]}% regn</b></div>`).join('');
    if(WEATHER_TS){ const d=new Date(WEATHER_TS); const p=n=>String(n).padStart(2,'0');
      const stamp=p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes());
      const off=(typeof navigator!=='undefined'&&navigator.onLine===false)?' · offline, sparad prognos':'';
      w+=`<div class="isub">Uppdaterad ${stamp}${off}</div>`; }
  }
  const weather=`<div class="infocard"><h3>🌤️ Väder i Slottsskogen</h3>${w}</div>`;
  const know=`<div class="infocard"><h3>ℹ️ Bra att veta</h3>
    <div class="irow"><span>Dungen (dansscenen)</span><b>18+</b></div>
    <div class="isub">Mer praktiskt (insläpp, väska, betalning) finns på wayoutwest.se/info.</div>
    <a class="btn" href="https://www.wayoutwest.se/info/" target="_blank" rel="noopener" style="margin-top:10px;justify-content:center">Officiell info ↗</a></div>`;
  return `<div style="padding:6px 0 4px">${hours}${weather}${know}</div>`;
}

function viewNu(){
  const {dayIdx,nowMin}=nowInfo();
  if(dayIdx<0){ // före/efter festivalen
    const now=new Date(), start=new Date(DAYS[0].date+'T14:00:00'), diff=start-now;
    let hero;
    if(diff>0){ const d=Math.floor(diff/86400000), h=Math.floor((diff%86400000)/3600000);
      hero=`<div class="nucount"><div class="nulbl">Way Out West börjar om</div><div class="nubig">${d} d ${h} h</div><div class="nusub">Torsdag 13 aug · Slottsskogen</div></div>`;
    } else hero=`<div class="nucount"><div class="nulbl">Way Out West</div><div class="nubig">Vi ses nästa år 🎶</div></div>`;
    const first=SETS.filter(s=>s.d===0).sort((a,b)=>a.startMin-b.startMin).slice(0,4);
    return hero+`<div class="thead">Först ut · torsdag</div>`+first.map(cardHTML).join('');
  }
  const day=DAYS[dayIdx];
  const myNext=SETS.filter(s=>s.d===dayIdx&&FAV.has(idOf(s))&&s.startMin>nowMin).sort((a,b)=>a.startMin-b.startMin)[0];
  const myNow=SETS.find(s=>s.d===dayIdx&&FAV.has(idOf(s))&&nowMin>=s.startMin&&nowMin<s.estEnd);
  let hero='';
  if(myNow) hero=`<div class="nucount live"><div class="nulbl">🔴 Du är på</div><div class="nubig">${esc(myNow.name)}</div><div class="nusub">${myNow.stage} · till ~${hhmm(myNow.estEnd)}</div></div>`;
  else if(myNext){ const m=myNext.startMin-nowMin, cd=m>=60?Math.floor(m/60)+' h '+(m%60)+' min':m+' min';
    hero=`<div class="nucount"><div class="nulbl">Ditt nästa pass · om ${cd}</div><div class="nubig">${esc(myNext.name)}</div><div class="nusub">${myNext.t} · ${myNext.stage}</div></div>`;
  } else hero=`<div class="nucount"><div class="nulbl">Ditt schema</div><div class="nubig">Inga fler favoriter idag</div><div class="nusub">Stjärnmärk fler i Schema-vyn</div></div>`;
  let rows='';
  STAGE_ORDER.forEach(st=>{
    const list=SETS.filter(s=>s.d===dayIdx&&s.stage===st).sort((a,b)=>a.startMin-b.startMin);
    const now=list.find(s=>nowMin>=s.startMin&&nowMin<s.endMin);
    const next=list.find(s=>s.startMin>nowMin);
    rows+=`<div class="nustage" style="border-left-color:${STAGES[st].hex}">
      <div class="nustagehd" style="color:${STAGES[st].hex}">${st}</div>
      <div class="nunow">${now?`<span class="livepill">NU</span> ${esc(now.name)}`:'<span style="color:var(--faint)">Inget just nu</span>'}</div>
      <div class="nunext">${next?`Härnäst ${next.t} · ${esc(next.name)}`:'Klart för idag'}</div>
    </div>`;
  });
  return hero+`<div class="thead">Just nu · ${day.lbl}</div>`+rows;
}

function stagePanelHTML(){
  if(!state.mapStage) return '';
  const day=DAYS[state.day], st=STAGES[state.mapStage];
  const list=SETS.filter(s=>s.d===state.day&&s.stage===state.mapStage).sort((a,b)=>a.startMin-b.startMin);
  return `<div class="stagepanel">
      <h3><span style="width:12px;height:12px;border-radius:50%;background:${st.hex};display:inline-block"></span> ${state.mapStage}
        <span style="margin-left:auto;font-size:12px;color:var(--muted);font-weight:600">${st.desc}</span></h3>
      <div style="font-size:12px;color:var(--muted);margin:2px 0 8px">${day.lbl}</div>
      ${list.length?list.map(s=>{const id=idOf(s),fav=FAV.has(id),status=statusOf(s);return `<div class="mini">
        <span class="time">${s.t}</span>
        <span class="mname">${esc(s.name)} ${status==='live'?'<span class="livepill">NU</span>':''}</span>
        ${s.preview?`<button class="btn play" data-play="${id}" style="padding:6px 9px">▶</button>`:''}
        <a class="btn sp" href="${spotify(s.name)}" target="_blank" rel="noopener" aria-label="Öppna i Spotify" style="padding:6px 8px">${SP_ICON}</a>
        <button class="mfav ${fav?'on':''}" data-fav="${id}">${fav?'★':'☆'}</button>
      </div>`;}).join(''):'<div style="color:var(--muted);padding:8px 2px">Inget på denna scen denna dag.</div>'}
    </div>`;
}
function firstStart(st,d){ const l=SETS.filter(s=>s.d===d&&s.stage===st&&!s.sow); if(!l.length)return ''; const m=Math.min(...l.map(s=>s.startMin)); return (l.find(s=>s.startMin===m).t||'').replace(':','.'); }
function viewKarta(){
  const legend = STAGE_ORDER.map(st=>`<span class="chip ${state.mapStage===st?'active':''}" data-mapstage="${st}" style="color:${STAGES[st].hex}"><span class="dot" style="background:${STAGES[st].hex}"></span>${st}</span>`).join('');
  const hots = STAGE_ORDER.map(st=>{const p=MAPHOT[st];const t=firstStart(st,state.day);return `<button class="hot ${state.mapStage===st?'sel':''}" data-mapstage="${st}" style="left:${p.x}%;top:${p.y}%;--sc:${STAGES[st].hex}" aria-label="${st}"><span class="hlbl">${st}${t?` <b>${t}</b>`:''}</span></button>`;}).join('');
  return `<div class="filters" style="padding-top:6px"><div class="chips">${legend}</div></div>
    <div class="mapouter">
      <div class="mapimg-wrap" id="mapwrap">
        <div class="mapzoom" id="mapzoom" style="transform:scale(${state.mapZoom||1})">
          <img class="mapimg" src="${MAPIMG}" alt="Way Out West – officiell karta över Slottsskogen">
          ${hots}
        </div>
      </div>
      <div class="zoomctrl">
        <button class="zoombtn" data-zoom="out" aria-label="Zooma ut">−</button>
        <button class="zoombtn" data-zoom="in" aria-label="Zooma in">+</button>
        <button class="zoombtn wide" data-zoom="fit">Hela</button>
      </div>
    </div>
    <div class="mapbtns">
      <a class="btn" href="https://www.google.com/maps/dir/?api=1&destination=57.6896,11.9527" target="_blank" rel="noopener">🧭 Hitta hit · Linnéplatsen</a>
    </div>
    <div class="maphint">Officiell områdeskarta från wayoutwest.se. Tryck på en <b>scen</b> för dagens lineup, eller zooma med knapparna.</div>
    <div id="stagePanel">${stagePanelHTML()}</div>`;
}
function selectStage(st){
  state.mapStage = state.mapStage===st ? null : st;
  document.querySelectorAll('.hot').forEach(h=>h.classList.toggle('sel',h.dataset.mapstage===state.mapStage));
  document.querySelectorAll('.chips [data-mapstage]').forEach(c=>c.classList.toggle('active',c.dataset.mapstage===state.mapStage));
  const p=$('#stagePanel'); if(p){ p.innerHTML=stagePanelHTML(); bind(); if(state.mapStage) p.scrollIntoView({behavior:'smooth',block:'nearest'}); }
}

/* ---------- event binding ---------- */
function bind(){
  document.querySelectorAll('[data-day]').forEach(b=>b.onclick=()=>{state.day=+b.dataset.day;state.mapStage=null;render();});
  const sr=$('#search'); if(sr){ sr.oninput=()=>{state.q=sr.value; const list=$('#main'); /* light rerender */ render(); const s2=$('#search'); if(s2){s2.focus();s2.setSelectionRange(sr.value.length,sr.value.length);} }; }
  document.querySelectorAll('[data-stage]').forEach(b=>b.onclick=()=>{state.stageFilter=b.dataset.stage;render();});
  document.querySelectorAll('[data-favonly]').forEach(b=>b.onclick=()=>{state.favOnly=!state.favOnly;render();});
  document.querySelectorAll('[data-fav]').forEach(b=>b.onclick=e=>{e.stopPropagation();toggleFav(b.dataset.fav);});
  document.querySelectorAll('[data-play]').forEach(b=>b.onclick=e=>{e.stopPropagation();const s=SETS.find(x=>idOf(x)===b.dataset.play);if(s)playSet(s);});
  document.querySelectorAll('[data-mapstage]').forEach(b=>b.onclick=()=>selectStage(b.dataset.mapstage));
  document.querySelectorAll('[data-zoom]').forEach(b=>b.onclick=()=>{
    const z=state.mapZoom||1;
    state.mapZoom = b.dataset.zoom==='in'?Math.min(z+0.6,3) : b.dataset.zoom==='out'?Math.max(z-0.6,1) : 1;
    const mz=$('#mapzoom'); if(mz) mz.style.transform='scale('+state.mapZoom+')';
  });
  const cb=$('#calbtn'); if(cb)cb.onclick=()=>downloadICS(state.day);
  document.querySelectorAll('[data-layout]').forEach(b=>b.onclick=()=>{state.layout=b.dataset.layout;render();});
}
document.querySelectorAll('.navbtn').forEach(b=>b.onclick=()=>{state.view=b.dataset.view; if(state.view!=='karta')state.mapStage=state.mapStage; render(); window.scrollTo(0,0);});

/* clock + live refresh */
function tick(){
  const t=new Date(); const clock=t.toLocaleTimeString('sv-SE',{hour:'2-digit',minute:'2-digit'});
  const {dayIdx}=nowInfo();
  if(dayIdx>=0){ $('#clock').textContent=clock; return; }              // pågår → visa klocka
  const diff=new Date('2026-08-13T12:00:00')-t;
  $('#clock').textContent = diff>0 ? (Math.ceil(diff/86400000)+' dgr kvar') : clock;
}
tick(); setInterval(()=>{tick(); if(state.view==='nu')render();},30000);

computeEnds();   // beräkna tider innan första render (SOW visas som egen sektion, ej i SETS)
render();

/* PWA: registrera service worker (endast på https/localhost) */
if('serviceWorker' in navigator){ window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{})); }
</script>
</body>
